  Source commit d639887a386b0de6fef2e61c97dc268631854591:
  mascot-geometry.js / mascot-eye-svg.js (see ../NOTICE).
  MODIFIED for pi-fairy-animation: standalone SVG, padded canvas, named offline
  animation anchors, white outer halo in both themes, separate contrast edge;
  browser effects, states, scanlines and glitch clones removed.
  Generated PNGs and vector previews inherit this attribution; see ../NOTICE.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="-1 -1 162 162">
  <title>Fairy — selective Fairy-DSH idle adaptation (unofficial)</title>
  <desc>Transparent floating blue eye, white soft halos, rotating corners, independently breathing eye layers and a lower-right catchlight. No official bitmap.</desc>
  <defs>
    <linearGradient id="outer-gradient" x1=".2" y1="0" x2=".8" y2="1">
      <stop stop-color="#4053f0"/>
      <stop offset=".54" stop-color="#3045dc"/>
      <stop offset="1" stop-color="#3d50c8"/>
    </linearGradient>
    <!-- One static radial field replaces separate halo strokes, avoiding alpha seams. -->
    <radialGradient id="sclera-halo-gradient" gradientUnits="userSpaceOnUse" cx="80" cy="80" r="56" color-interpolation="linearRGB">
      <stop offset=".82" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".864" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".875" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".89" stop-color="#ffffff" stop-opacity=".19"/>
      <stop offset=".91" stop-color="#ffffff" stop-opacity=".11"/>
      <stop offset=".94" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset=".96" stop-color="#ffffff" stop-opacity=".035"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="outer-halo-gradient" gradientUnits="userSpaceOnUse" cx="80" cy="80" r="79" color-interpolation="linearRGB">
      <stop offset=".80" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".84" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset=".868" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".90" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".95" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset=".99" stop-color="#ffffff" stop-opacity=".02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="highlight-halo-gradient" gradientUnits="userSpaceOnUse" cx="98" cy="100.5" r="18" color-interpolation="linearRGB">
      <stop offset=".53" stop-color="#f5f8fd" stop-opacity="0"/>
      <stop offset=".56" stop-color="#f5f8fd" stop-opacity=".16"/>
      <stop offset=".611" stop-color="#f5f8fd" stop-opacity=".43"/>
      <stop offset=".72" stop-color="#f5f8fd" stop-opacity=".19"/>
      <stop offset=".77" stop-color="#f5f8fd" stop-opacity=".12"/>
      <stop offset=".83" stop-color="#f5f8fd" stop-opacity=".055"/>
      <stop offset=".89" stop-color="#f5f8fd" stop-opacity=".02"/>
      <stop offset=".96" stop-color="#f5f8fd" stop-opacity=".004"/>
      <stop offset="1" stop-color="#f5f8fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 79-unit halo within an 81-unit half-canvas: padding with near-original apparent disc size. -->
  <g id="fairy">
    <circle id="outer-halo" cx="80" cy="80" r="79" fill="url(#outer-halo-gradient)"/>
    <!-- Only this supporting edge changes with theme; white rim and halo stay white. -->
    <circle id="contrast-edge" cx="80" cy="80" r="68" fill="none" stroke="#dceaff" stroke-width="1.8"/>
    <circle id="outer-disc" cx="80" cy="80" r="68" fill="url(#outer-gradient)" stroke="#f2fbff" stroke-width="1.2"/>
    <g id="corners" transform="rotate(0 80 80)" fill="#2b3388">
      <circle cx="80" cy="80" r="51.75"/>
      <rect x="37" y="37" width="86" height="86" rx="2" transform="rotate(3 80 80)"/>
    </g>
    <g id="sclera" transform="translate(80 80) scale(1) translate(-80 -80)">
      <circle cx="80" cy="80" r="48" fill="#eef0f5"/>
      <circle id="sclera-halo" cx="80" cy="80" r="56" fill="url(#sclera-halo-gradient)"/>
      <circle cx="80" cy="80" r="48" fill="none" stroke="#ffffff" stroke-width=".8" stroke-opacity=".16"/>
    </g>
    <g id="iris-outer" transform="translate(80 80) scale(1) translate(-80 -80)">
      <circle cx="80" cy="80" r="33" fill="#9daee0"/>
    </g>
    <g id="iris-blue" transform="translate(80 80) scale(1) translate(-80 -80)">
      <circle cx="80" cy="80" r="24.15" fill="#eef0f5"/>
      <circle cx="80" cy="80" r="23.5" fill="#317bcf"/>
    </g>
    <g id="pupil" transform="translate(80 80) scale(1) translate(-80 -80)">
      <circle cx="80" cy="80" r="16.6" fill="none" stroke="#f5f8fd" stroke-width=".1"/>
      <circle cx="80" cy="80" r="16" fill="#3b3d8a"/>
    </g>
    <!-- Same phase as blue iris, but painted last (above pupil), as in upstream. -->
    <g id="highlight" transform="translate(80 80) scale(1) translate(-80 -80)">
      <circle id="highlight-halo" cx="98" cy="100.5" r="18" fill="url(#highlight-halo-gradient)"/>
      <circle id="catchlight-lower-right" cx="98" cy="100.5" r="11" fill="#f5f8fd"/>
    </g>
  </g>
</svg>
